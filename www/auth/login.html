<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" href="../favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HerboraTech — Masuk</title>
  <link rel="stylesheet" href="../shared/neumorphic.css">
  <script type='module' src='https://unpkg.com/ionicons@5.0.0/dist/ionicons/ionicons.esm.js'></script>
  <script nomodule src='https://unpkg.com/ionicons@5.0.0/dist/ionicons/ionicons.js'></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }

    /* BG */
    /* Latar terang dengan dua blob emerald, sama seperti hero landing
       page. Sebelumnya gradien gelap penuh layar dengan strip EKG
       beranimasi — bahasa visual lama yang sudah dibuang dari index. */
    .auth-bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(680px 680px at 12% -10%, rgba(23,160,92,0.16), transparent 62%),
        radial-gradient(520px 520px at 92% 104%, rgba(143,211,172,0.26), transparent 64%),
        var(--bg);
    }
    .auth-bg::before {
      content:''; position:absolute; inset:0;
      background-image:radial-gradient(circle,rgba(255,255,255,0.025) 1px,transparent 1px);
      background-size:28px 28px;
    }
    .auth-bg::after {
      content:''; position:absolute; bottom:-100px; left:50%; transform:translateX(-50%);
      width:600px; height:600px; border-radius:50%;
      background:radial-gradient(circle, rgba(23,160,92,0.07) 0%, transparent 70%);
    }

    /* MAIN */
    .auth-page { position:relative; z-index:1; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; }

    /* BACK LINK */
    .back-link { position:fixed; top:18px; left:18px; z-index:10; display:inline-flex; align-items:center; gap:6px; color:var(--text-secondary); font-size:0.82rem; font-weight:600; text-decoration:none; padding:8px 14px; border-radius:999px; background:var(--surface); border:1px solid rgba(16,24,40,0.10); box-shadow:var(--shadow-out-sm); transition:color 0.2s, border-color 0.2s; }
    .back-link:hover { color:var(--primary-dark); border-color:rgba(23,160,92,0.35); }

    /* CARD */
    .auth-card {
      background: var(--surface);
      border: 1px solid rgba(16,24,40,0.10);
      border-radius: 26px;
      padding: 40px 34px;
      width: 100%;
      max-width: 430px;
      box-shadow: var(--shadow-out-lg);
      animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes cardIn { from { opacity:0; transform:translateY(30px) scale(0.96); } to { opacity:1; transform:none; } }
    @media (max-width: 480px) { .auth-card { padding: 32px 24px; border-radius: 24px; } }

    /* LOGO */
    .auth-logo { text-align:center; margin-bottom:28px; }
    .logo-mark { width:60px; height:60px; margin:0 auto 12px; }
    .logo-mark svg { width:60px; height:60px; display:block; border-radius:17px; box-shadow:0 8px 22px rgba(14,124,70,0.28); }
    .logo-mark ion-icon { font-size:2rem; color:#fff; }
    .auth-logo .brand { font-size:1.4rem; font-weight:800; color:var(--text-primary); letter-spacing:-0.5px; }
    .auth-logo .brand span { color:var(--primary-dark); }
    .auth-logo p { font-size:0.82rem; color:var(--text-secondary); margin-top:3px; }

    /* DIVIDER */
    .divider-label { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
    .divider-label::before, .divider-label::after { content:''; flex:1; height:1px; background:rgba(0,0,0,0.08); }
    .divider-label span { font-size:0.75rem; color:var(--text-secondary); white-space:nowrap; }

    /* INPUTS */
    .form-group { margin-bottom:16px; }
    .form-label { display:block; font-size:0.77rem; font-weight:600; color:var(--text-secondary); margin-bottom:7px; letter-spacing:0.02em; }
    .input-wrap { position:relative; }
    .input-wrap ion-icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--text-secondary); font-size:1rem; pointer-events:none; }
    .neu-input { width:100%; background:var(--bg); border:none; border-radius:12px; padding:12px 14px 12px 40px; font-size:0.875rem; color:var(--text-primary); box-shadow:var(--shadow-in); font-family:'Plus Jakarta Sans',sans-serif; outline:none; transition:box-shadow 0.2s; }
    .neu-input:focus { box-shadow:var(--shadow-in), 0 0 0 2px rgba(14,124,70,0.25); }
    .neu-input::placeholder { color:var(--text-secondary); opacity:0.6; }
    .pw-toggle { position:absolute; right:14px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--text-secondary); font-size:1rem; padding:4px; }

    /* FORGOT */
    .forgot-row { display:flex; justify-content:flex-end; margin-bottom:20px; margin-top:-8px; }
    .forgot-link { font-size:0.77rem; color:var(--primary-dark); font-weight:600; text-decoration:none; }
    .forgot-link:hover { text-decoration:underline; }

    /* SUBMIT BTN */
    .btn-login { width:100%; padding:14px; border-radius:14px; background:linear-gradient(135deg,#0E7C46,#0A5F35); color:#fff; font-size:0.95rem; font-weight:700; border:none; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif; box-shadow:0 6px 24px rgba(23,160,92,0.4); transition:transform 0.2s,box-shadow 0.2s; display:flex; align-items:center; justify-content:center; gap:8px; letter-spacing:0.02em; }
    .btn-login:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 10px 32px rgba(23,160,92,0.5); }
    .btn-login:active { transform:translateY(0); }
    .btn-login:disabled { opacity:0.7; cursor:not-allowed; transform:none; }

    /* SOCIAL LOGIN */
    .social-login { display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:20px; }
    .btn-social { display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 14px; border-radius:12px; background:var(--bg); box-shadow:var(--shadow-out); font-size:0.8rem; font-weight:600; color:var(--text-primary); border:none; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif; transition:transform 0.2s; }
    .btn-social:hover:not(:disabled) { transform:translateY(-2px); }
    .btn-social:disabled { opacity:0.7; cursor:not-allowed; }
    .social-logo { width:18px; height:18px; border-radius:4px; object-fit:contain; font-size:1rem; }

    /* ERROR BOX */
    #auth-error { display:none; background:rgba(201,74,66,0.08); border:1px solid rgba(201,74,66,0.25); border-radius:10px; padding:10px 14px; margin-bottom:16px; font-size:0.8rem; color:#C0392B; font-weight:500; line-height:1.5; }
    #auth-error.show { display:flex; align-items:flex-start; gap:8px; }
    #auth-error ion-icon { font-size:1rem; flex-shrink:0; margin-top:1px; color:#C94A42; }

    /* REGISTER LINK */
    .register-row { text-align:center; margin-top:20px; }
    .register-row p { font-size:0.82rem; color:var(--text-secondary); }
    .register-row a { color:var(--primary-dark); font-weight:700; text-decoration:none; }
    .register-row a:hover { text-decoration:underline; }

    /* ECG decoration */
    .ecg-deco { display:none; }
    .ecg-deco svg { width:200%; animation:ecgScroll 14s linear infinite; }
    @keyframes ecgScroll { from{transform:translateX(0)} to{transform:translateX(-50%)} }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

<!-- BG -->
<div class="auth-bg"></div>

<!-- ECG decoration -->
<div class="ecg-deco">
  <svg viewBox="0 0 1440 40" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <polyline points="0,20 80,20 100,20 110,5 120,35 130,5 140,20 160,20 240,20 260,20 270,8 280,32 290,8 300,20 320,20 400,20 420,20 430,5 440,35 450,5 460,20 480,20 560,20 580,20 590,8 600,32 610,8 620,20 640,20 720,20 740,20 750,5 760,35 770,5 780,20 800,20 880,20 900,20 910,8 920,32 930,8 940,20 960,20 1040,20 1060,20 1070,5 1080,35 1090,5 1100,20 1120,20 1200,20 1220,20 1230,8 1240,32 1250,8 1260,20 1280,20 1360,20 1380,20 1390,5 1400,35 1410,5 1420,20 1440,20" fill="none" stroke="#17A05C" stroke-width="1.5"/>
    <polyline points="1440,20 1520,20 1540,20 1550,5 1560,35 1570,5 1580,20 1600,20 1680,20 1700,20 1710,8 1720,32 1730,8 1740,20 1760,20 1840,20 1860,20 1870,5 1880,35 1890,5 1900,20 1920,20 2000,20 2020,20 2030,8 2040,32 2050,8 2060,20 2080,20 2160,20 2180,20 2190,5 2200,35 2210,5 2220,20 2240,20 2320,20 2340,20 2350,8 2360,32 2370,8 2380,20 2400,20 2440,20 2460,20 2470,5 2480,35 2490,5 2500,20 2520,20 2600,20 2620,20 2630,8 2640,32 2650,8 2660,20 2680,20 2760,20 2780,20 2790,5 2800,35 2810,5 2820,20 2840,20 2880,20" fill="none" stroke="#17A05C" stroke-width="1.5"/>
  </svg>
</div>

<!-- BACK LINK -->
<a href="../index.html" class="back-link">
  <ion-icon name="arrow-back-outline"></ion-icon> Kembali ke Beranda
</a>

<!-- AUTH PAGE -->
<main class="auth-page">
  <div class="auth-card">

    <!-- LOGO -->
    <div class="auth-logo">
      <div class="logo-mark">
        <!-- Lambang HerboraTech: daun dengan garis EKG di dalamnya.
             Sama dengan yang dipakai di landing page. -->
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="64" height="64" rx="17" fill="#0E7C46"/>
          <clipPath id="leafClipLogin">
            <path d="M16 50 C16 29 30.5 13.5 52 11.5 C50.5 34 36.5 50 16 50 Z"/>
          </clipPath>
          <g clip-path="url(#leafClipLogin)">
            <rect width="64" height="64" fill="#FFFFFF"/>
            <path d="M55 8 L14 62 L64 64 L64 0 Z" fill="#BCDECB"/>
          </g>
          <path d="M11.5 56.5 L19.5 47.5" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round"/>
          <path d="M23 39.5 H30 L33.2 30.5 L37.4 46 L40.2 37 H46.5" fill="none" stroke="#0E7C46"
                stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand">Herbora<span>Tech</span></div>
      <p>Platform Telemedisin AIoT Indonesia</p>
    </div>

    <!-- SOCIAL LOGIN -->
    <div class="social-login">
      <button class="btn-social" id="googleBtn" onclick="doGoogleLogin()">
        <span style="font-size:1.1rem;font-weight:900;color:#EA4335;">G</span> Google
      </button>
    </div>

    <div class="divider-label"><span>atau masuk dengan email</span></div>

    <!-- ERROR BOX -->
    <div id="auth-error">
      <ion-icon name="alert-circle-outline"></ion-icon>
      <span id="auth-error-text"></span>
    </div>

    <!-- FORM -->
    <div class="form-group">
      <label class="form-label">Email</label>
      <div class="input-wrap">
        <ion-icon name="mail-outline"></ion-icon>
        <input type="email" class="neu-input" id="emailInput" placeholder="email@contoh.com" autocomplete="email">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-wrap">
        <ion-icon name="lock-closed-outline"></ion-icon>
        <input type="password" class="neu-input" id="pwInput" placeholder="Masukkan password" autocomplete="current-password">
        <button class="pw-toggle" onclick="togglePw()" id="pwToggleBtn" type="button">
          <ion-icon name="eye-outline" id="pwIcon"></ion-icon>
        </button>
      </div>
    </div>

    <div class="forgot-row">
      <a href="forgot-password.html" class="forgot-link">Lupa password?</a>
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      <ion-icon name="log-in-outline"></ion-icon>
      <span id="loginBtnText">Masuk</span>
    </button>

    <div class="register-row">
      <p>Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
    </div>

  </div>
</main>

<script src="../shared/app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../shared/firebase.js"></script>
<script>
  function togglePw() {
    const input = document.getElementById('pwInput');
    const icon  = document.getElementById('pwIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.setAttribute('name','eye-off-outline');
    } else {
      input.type = 'password';
      icon.setAttribute('name','eye-outline');
    }
  }

  function showToastMsg(msg, type) {
    if (typeof showToast === 'function') showToast(msg, type || 'info');
    else alert(msg);
  }

  function showError(msg) {
    const box  = document.getElementById('auth-error');
    const text = document.getElementById('auth-error-text');
    text.textContent = msg;
    box.classList.add('show');
  }

  function hideError() {
    document.getElementById('auth-error').classList.remove('show');
  }

  function setLoading(loading) {
    const btn = document.getElementById('loginBtn');
    const googleBtn = document.getElementById('googleBtn');
    if (loading) {
      btn.innerHTML = '<ion-icon name="reload-outline" style="animation:spin 0.8s linear infinite"></ion-icon><span>Memuat...</span>';
      btn.disabled = true;
      googleBtn.disabled = true;
    } else {
      btn.innerHTML = '<ion-icon name="log-in-outline"></ion-icon><span id="loginBtnText">Masuk</span>';
      btn.disabled = false;
      googleBtn.disabled = false;
    }
  }

  function getErrorMessage(code) {
    const map = {
      'auth/wrong-password':       'Email atau password salah.',
      'auth/user-not-found':       'Akun tidak ditemukan.',
      'auth/email-not-verified':   null, // handled as toast
      'auth/invalid-email':        'Format email tidak valid.',
      'auth/too-many-requests':    'Terlalu banyak percobaan. Coba lagi nanti.',
      'auth/user-disabled':        'Akun Anda telah dinonaktifkan.',
      'auth/invalid-credential':   'Email atau password salah.',
    };
    return map[code] || 'Terjadi kesalahan. Silakan coba lagi.';
  }

  async function doLogin() {
    const email = document.getElementById('emailInput').value.trim();
    const pw    = document.getElementById('pwInput').value;
    hideError();

    if (!email) { showError('Masukkan email Anda.'); return; }
    if (!pw)    { showError('Masukkan password Anda.'); return; }

    setLoading(true);
    try {
      const { user, role } = await VAuth.login(email, pw);
      showToastMsg('Selamat datang kembali!', 'success');
      VAuth.redirectByRole(role, 1);
    } catch (err) {
      setLoading(false);
      if (err.code === 'auth/email-not-verified') {
        showToastMsg('Silakan verifikasi email Anda dulu. Cek inbox dan klik link verifikasi.', 'warning');
      } else {
        showError(getErrorMessage(err.code));
      }
    }
  }

  async function doGoogleLogin() {
    hideError();
    const googleBtn = document.getElementById('googleBtn');
    const loginBtn  = document.getElementById('loginBtn');
    googleBtn.disabled = true;
    loginBtn.disabled  = true;
    googleBtn.innerHTML = '<ion-icon name="reload-outline" style="animation:spin 0.8s linear infinite"></ion-icon> Memuat...';

    try {
      const result = await VAuth.loginGoogle('patient');

      // New user - redirect to role selection
      if (result.isNewUser) {
        showToastMsg('Akun baru! Pilih role Anda...', 'info');
        setTimeout(() => {
          window.location.href = 'select-role.html';
        }, 1000);
        return;
      }

      // Check role status
      if (result.roleStatus === 'pending') {
        showToastMsg('Menunggu persetujuan admin...', 'warning');
        setTimeout(() => {
          window.location.href = 'pending-approval.html';
        }, 1000);
        return;
      }

      if (result.roleStatus === 'rejected') {
        showToastMsg('Permintaan role ditolak.', 'error');
        setTimeout(() => {
          window.location.href = 'role-rejected.html';
        }, 1000);
        return;
      }

      // Approved - redirect to appropriate portal
      showToastMsg('Login Google berhasil!', 'success');
      VAuth.redirectByRole(result.role, 1);

    } catch (err) {
      googleBtn.innerHTML = '<span style="font-size:1.1rem;font-weight:900;color:#EA4335;">G</span> Google';
      googleBtn.disabled = false;
      loginBtn.disabled  = false;
      if (err.code !== 'auth/popup-closed-by-user') {
        showError(getErrorMessage(err.code));
      }
    }
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
